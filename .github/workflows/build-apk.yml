name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APKs
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/release.p12"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/release.p12"
            echo "Signing with the permanent key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret missing - APK signed with a throwaway key and will not update an installed copy"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AmbientRemote.apk
          cp app/build/outputs/apk/debug/app-debug.apk AmbientRemote-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: AmbientRemote-apk
          path: AmbientRemote*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ambient Remote build ${{ github.run_number }}
          make_latest: true
          files: |
            AmbientRemote.apk
            AmbientRemote-debug.apk
